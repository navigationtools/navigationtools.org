<svg xmlns="http://www.w3.org/2000/svg" width="776" height="430" viewBox="0 0 776 430" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker></defs><rect width="776" height="430" fill="white"/><text x="388.0" y="30" text-anchor="middle" font-size="19" font-weight="bold">Operating navigationtools.org</text><rect x="268" y="55" width="240" height="62" rx="10" fill="#e8f0fe" stroke="#33415c" stroke-width="1.5"/><text x="388.0" y="79" text-anchor="middle" font-weight="bold" font-size="15">A visitor</text><text x="388.0" y="101" text-anchor="middle" font-size="12.5">types an address</text><rect x="268" y="160" width="240" height="62" rx="10" fill="#fce8e6" stroke="#33415c" stroke-width="1.5"/><text x="388.0" y="184" text-anchor="middle" font-weight="bold" font-size="15">Cloudflare DNS</text><text x="388.0" y="206" text-anchor="middle" font-size="12.5">answers for navigationtools.org</text><line x1="388" y1="117" x2="388" y2="158" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><rect x="16" y="280" width="178" height="130" rx="10" fill="#e6f4ea" stroke="#33415c" stroke-width="1.5"/><text x="105.0" y="304" text-anchor="middle" font-weight="bold" font-size="15"></text><text x="105.0" y="326" text-anchor="middle" font-size="12.5">Worker navigationtools-org</text><text x="105.0" y="344" text-anchor="middle" font-size="12.5">serves Hugo&#x27;s public/</text><text x="105.0" y="362" text-anchor="middle" font-size="12.5">unknown pages: 404 page</text><text x="105.0" y="380" text-anchor="middle" font-size="12.5">public</text><text x="105.0" y="302" text-anchor="middle" font-weight="bold" font-size="11">navigationtools.org</text><line x1="388" y1="222" x2="105.0" y2="278" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><rect x="204" y="280" width="178" height="130" rx="10" fill="#e6f4ea" stroke="#33415c" stroke-width="1.5"/><text x="293.