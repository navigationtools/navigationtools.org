<svg xmlns="http://www.w3.org/2000/svg" width="910" height="470" viewBox="0 0 910 470" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33415c"/></marker></defs><rect width="910" height="470" fill="white"/><text x="455.0" y="30" text-anchor="middle" font-size="19" font-weight="bold">Developing navigationtools.org</text><rect x="30" y="70" width="380" height="90" rx="10" fill="#e8f0fe" stroke="#33415c" stroke-width="1.5"/><text x="220.0" y="94" text-anchor="middle" font-weight="bold" font-size="15">1. A shipmate releases</text><text x="220.0" y="116" text-anchor="middle" font-size="12.5">writes a web note to inbox/navigationtools/:</text><text x="220.0" y="134" text-anchor="middle" font-size="12.5">what changed and why, release text, documents</text><rect x="500" y="70" width="380" height="90" rx="10" fill="#e6f4ea" stroke="#33415c" stroke-width="1.5"/><text x="690.0" y="94" text-anchor="middle" font-weight="bold" font-size="15">2. Navigation Tools session</text><text x="690.0" y="116" text-anchor="middle" font-size="12.5">writes the page (content/*.md), copies the PDFs</text><text x="690.0" y="134" text-anchor="middle" font-size="12.5">and pictures into static/; checks the build</text><rect x="500" y="215" width="380" height="90" rx="10" fill="#e6f4ea" stroke="#33415c" stroke-width="1.5"/><text x="690.0" y="239" text-anchor="middle" font-weight="bold" font-size="15">3. The queue request</text><text x="690.0" y="261" text-anchor="middle" font-size="12.5">one request in spec/queue/: repository,</text><text x="690.0" y="279" text-anchor="middle" font-size="12.5">paths, message; the session reads it back</text><rect x="30" y="215" width="380" height="90" rx="10" fill="#fef7e0" stroke="#33415c" stroke-width="1.5"/><text x="220.0" y="239" text-anchor="middle" font-weight="bold" font-size="15">4. Larry runs the queue</text><text x="220.0" y="261" text-anchor="middle" font-size="12.5">checks the paths and PDF pairs, builds the</text><text x="220.0" y="279" text-anchor="middle" font-size="12.5">site (tests/gate.sh), commits and pushes</text><rect x="30" y="360" width="380" height="90" rx="10" fill="#fce8e6" stroke="#33415c" stroke-width="1.5"/><text x="220.0" y="384" text-anchor="middle" font-weight="bold" font-size="15">5. Cloudflare builds</text><text x="220.0" y="406" text-anchor="middle" font-size="12.5">sees the push to main; downloads Hugo 0.169.0;</text><text x="220.0" y="424" text-anchor="middle" font-size="12.5">builds public/; Worker navigationtools-org serves it</text><rect x="500" y="360" width="380" height="90" rx="10" fill="#e6f4ea" stroke="#33415c" stroke-width="1.5"/><text x="690.0" y="384" text-anchor="middle" font-weight="bold" font-size="15">6. Live, and checked</text><text x="690.0" y="406" text-anchor="middle" font-size="12.5">navigationtools.org updated in a minute or two;</text><text x="690.0" y="424" text-anchor="middle" font-size="12.5">the session opens the page to confirm</text><line x1="410" y1="115.0" x2="498" y2="115.0" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><line x1="690.0" y1="160" x2="690.0" y2="213" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="260.0" x2="412" y2="260.0" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><line x1="220.0" y1="305" x2="220.0" y2="358" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><line x1="410" y1="405.0" x2="498" y2="405.0" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/></svg>